name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # Lint and Type Check
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned to the same ranges as pyproject [project.optional-dependencies].dev
          # so local and CI formatters cannot drift apart (black formatting
          # changes between minor versions).
          pip install "black>=26.5,<27" "ruff>=0.15.22,<0.16" mypy

      - name: Check formatting with Black
        run: black --check --diff src/ tests/

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type check with MyPy
        run: mypy src/sentinelflow --ignore-missing-imports
        continue-on-error: true

  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=sentinelflow --cov-report=xml --cov-report=term-missing --cov-fail-under=45
        env:
          PYTHONPATH: src

      # API contract gate: committed frontend schema must match FastAPI OpenAPI.
      - name: Check API contract schema is fresh
        run: |
          python scripts/export_openapi.py --check
        env:
          PYTHONPATH: src

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # PostgreSQL: Alembic migrations + case concurrency on a real database
  # ===========================================================================
  postgres:
    name: PostgreSQL Migrations & Concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow_ci
          POSTGRES_DB: sentinelflow_test
        options: >-
          --health-cmd "pg_isready -U sentinelflow -d sentinelflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PostgreSQL tests
        run: |
          pytest tests/ -v -m postgres --tb=short
        env:
          PYTHONPATH: src
          SENTINELFLOW_TEST_POSTGRES_URL: postgresql+psycopg2://sentinelflow:sentinelflow_ci@localhost:5432/sentinelflow_test
          SENTINELFLOW_REQUIRE_POSTGRES: "1"

  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.15.0
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/sentinelflow
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          sleep 15

      - name: Run integration tests
        run: |
          pytest tests/ -v -m "integration" --tb=short
        env:
          PYTHONPATH: src
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: sentinelflow
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ===========================================================================
  # ML Model Tests
  # ===========================================================================
  ml-tests:
    name: ML Model Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the core install has no PyTorch (ML-08)
        run: |
          if python -c "import torch" 2>/dev/null; then
            echo "torch is installed by the core dependencies"; exit 1
          fi

      - name: Run ML tests
        run: |
          pytest tests/test_samld_dataset.py tests/test_ml_*.py -v --tb=short
        env:
          PYTHONPATH: src

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project and security tools
        run: |
          # The runner's Python 3.11 ships setuptools 65.5.0 (PYSEC-2022-43012,
          # PYSEC-2025-49, PYSEC-2026-1918, PYSEC-2026-3447); pip-audit scans the
          # whole environment, so raise it to the first fixed release.
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          # Install the project so pip-audit scans the real dependency tree
          # instead of a near-empty tooling environment.
          pip install -e .
          pip install bandit pip-audit

      - name: Run Bandit security scan
        run: bandit -r src/sentinelflow -ll -ii

      - name: Check dependencies for vulnerabilities
        run: pip-audit --desc

  # ===========================================================================
  # Frontend Tests
  # ===========================================================================
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinelflow-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sentinelflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ===========================================================================
  # Browser tests (SF-404): real API + PostgreSQL + production web build
  # ===========================================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow_ci
          POSTGRES_DB: sentinelflow_e2e
        options: >-
          --health-cmd "pg_isready -U sentinelflow -d sentinelflow_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://sentinelflow:sentinelflow_ci@localhost:5432/sentinelflow_e2e
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # No model on purpose: e2e/model-state.spec.ts checks the degraded state.
      SENTINELFLOW_MODEL_DIR: build/e2e/no-model
      PYTHONPATH: src
      E2E_PYTHON: python
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate per-run secrets
        run: |
          jwt="$(openssl rand -hex 32)"
          password="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$jwt"
          echo "::add-mask::$password"
          echo "JWT_SECRET_KEY=$jwt" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install API
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sentinelflow-web/package-lock.json

      - name: Install web dependencies and Chromium
        working-directory: sentinelflow-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build web
        working-directory: sentinelflow-web
        run: npm run build

      - name: Start API and web
        run: |
          mkdir -p build/e2e
          nohup python -m uvicorn sentinelflow.api.app:app --host 127.0.0.1 --port 8000 \
            > build/e2e/api.log 2>&1 &
          (cd sentinelflow-web && nohup npm run start -- --hostname 127.0.0.1 --port 3000 \
            > ../build/e2e/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/system/health > /dev/null \
              && curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "API or web did not start"; tail -50 build/e2e/api.log build/e2e/web.log; exit 1

      - name: Run Playwright
        working-directory: sentinelflow-web
        run: npx playwright test

      - name: Upload traces, screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            sentinelflow-web/test-results/
            sentinelflow-web/playwright-report/
            build/e2e/*.log
          retention-days: 14

  # ===========================================================================
  # Build Docker Image
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner and repository name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
