name: ML Pipeline

# ML-07 (ADR 0003 §7–§10). Two jobs, kept apart on purpose:
# - Quality Gate: re-checks the committed locked-test report (reports/ml04) of the
#   model that ships against the targets in code. A model below target fails here.
# - Training Pipeline: runs the real entry points (ML-04 features → select →
#   evaluate-test → ML-05 package) on a synthetic dataset, measures serving latency
#   and uploads the artifact. It proves the chain works; it is not model evidence
#   and never selects a model on the SAML-D locked test.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/sentinelflow/ml/**'
      - 'reports/ml04/**'
      - 'tests/fixtures/ml/**'
      - 'pyproject.toml'
      - '.github/workflows/ml-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/sentinelflow/ml/**'
      - 'reports/ml04/**'
      - 'tests/fixtures/ml/**'
      - 'pyproject.toml'
      - '.github/workflows/ml-pipeline.yml'
  workflow_dispatch:
    inputs:
      size:
        description: 'Synthetic dataset size for the training pipeline'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - full
  # Weekly full-size run of the chain (same code, larger synthetic data).
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: ml-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: "src"

jobs:
  # ===========================================================================
  # Quality gate on the committed model (fails below target)
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Re-check locked-test report against ADR 0003 targets
        run: python -m sentinelflow.ml.ci gate --report-dir reports/ml04

  # ===========================================================================
  # Training chain smoke on synthetic data + serving latency
  # ===========================================================================
  pipeline:
    name: Training Pipeline
    runs-on: ubuntu-latest
    env:
      SIZE: ${{ github.event_name == 'schedule' && 'full' || inputs.size || 'fast' }}
      DATASET_DIR: build/ml-ci/samld/synthetic-ci
      WORK_DIR: build/ml-ci/work
      REPORT_DIR: build/ml-ci/reports
      MODEL_ROOT: build/ml-ci/models

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Synthetic dataset (ML-02 layout)
        run: python -m sentinelflow.ml.ci synthetic --out "$DATASET_DIR" --size "$SIZE"

      - name: Features (fs-1)
        run: python -m sentinelflow.ml.training features --dataset-dir "$DATASET_DIR"

      - name: Train and select on validation
        run: >
          python -m sentinelflow.ml.training select --dataset-dir "$DATASET_DIR"
          --work-dir "$WORK_DIR" --report-dir "$REPORT_DIR" --num-threads 2

      - name: Evaluate the test split once
        # The commit check guards the real SAML-D test set; this run uses synthetic data.
        run: >
          python -m sentinelflow.ml.training evaluate-test --dataset-dir "$DATASET_DIR"
          --work-dir "$WORK_DIR" --report-dir "$REPORT_DIR" --skip-commit-check

      - name: Package artifact and model card (ML-05)
        run: >
          python -m sentinelflow.ml.training package
          --work-dir "$WORK_DIR" --report-dir "$REPORT_DIR" --out "$MODEL_ROOT"

      - name: Metrics summary
        run: python -m sentinelflow.ml.ci gate --report-dir "$REPORT_DIR" --smoke

      - name: Serving latency with real feature vectors
        run: >
          python -m sentinelflow.ml.ci benchmark --dataset-dir "$DATASET_DIR"
          --model-dir "$(ls -d "$MODEL_ROOT"/fraud-lgbm-*)"

      - name: Upload artifact and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-${{ env.SIZE }}
          path: |
            build/ml-ci/models/
            build/ml-ci/reports/
            build/ml-ci/samld/synthetic-ci/manifest.json
          if-no-files-found: warn
